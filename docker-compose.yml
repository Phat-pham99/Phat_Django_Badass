version: '1.3'

services:
  web:
    build: .
    container_name: phat_django_web
    restart: unless-stopped
    command: granian --interface asgi Phat_Django_Badass.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - .:/app  # Optional: mounts your code for live reloads in dev, remove for pure prod
      - static_volume:/app/statics  # Shares static files with Nginx
    env_file:
      - .env  # Keep your Cloudflare D1 and Upstash Redis keys in here
    networks:
      - django_network

  nginx:
    image: nginx:alpine
    container_name: phat_django_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/statics:ro  # Read-only access to static files
    depends_on:
      - web
    networks:
      - django_network

networks:
  django_network:
    driver: bridge

volumes:
  static_volume: