services:
  web:
    build: .
    container_name: phat_django_web
    restart: unless-stopped
    command: sh -c "python3 manage.py collectstatic --noinput && granian --interface asgi Phat_Django_Badass.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    networks:
      - django_network
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - "**/.git/***"
            - "**/venv/***"
            - "**/__pycache__/***"
            - "**/*.pyc"
            - "**/.dockerignore"
            - "**/.gitignore"

  nginx:
    image: nginx:alpine
    container_name: phat_django_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro  # Read-only access to static files
    depends_on:
      - web
    networks:
      - django_network

networks:
  django_network:
    driver: bridge

volumes:
  static_volume:
