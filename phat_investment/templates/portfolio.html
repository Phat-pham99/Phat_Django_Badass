{% extends "base.html" %}

{% load humanizelib %}

{% block title %}Phat Portfolio Dashboard{% endblock %}

{% block extra_head %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
{% endblock %}

{% block content %}
    <h1>Phat Portfolio track Dashboard</h1>

    <div class="card">
        <canvas id="portfolioChart" style="width: 100%; height: 500px;"></canvas>
    </div>

    <form method="post" class="filter-form">
        {% csrf_token %}
        {{ date_filter }}
        <button type="submit" class="btn">Submit</button>
    </form>
{% endblock %}

{% block extra_scripts %}
    <script>
        let portfolio_data1 = "{{ portfolio_data|safe }}";
        portfolio_data1 = portfolio_data1.replace(/'/g, '"');
        let portfolio_data = JSON.parse(portfolio_data1);
        const data = {
            labels: portfolio_data['date'],
            datasets: [
                { label: 'acbs', data: portfolio_data['acbs'], borderColor: "#86ff36", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
                { label: 'mio', data: portfolio_data['mio'], borderColor: "#969696", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
                { label: 'dragon', data: portfolio_data['dragon'], borderColor: "#005709", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
                { label: 'ssi', data: portfolio_data['ssi'], borderColor: "#ff0000", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
                { label: 'idle_cash', data: portfolio_data['idle_cash'], borderColor: "#b08e07", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
                { label: 'crypto', data: portfolio_data['crypto'], borderColor: "#49047a", pointStyle: 'circle', pointRadius: 1, pointHoverRadius: 5, fill: false },
            ]
        };
        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                scales: { y: { stacked: false } },
                plugins: {
                    title: {
                        display: true,
                        text: 'Portfolio Value Over Time',
                        fontSize: 22,
                        fontColor: "#1f2d27"
                    }
                }
            }
        };
        new Chart("portfolioChart", config);
    </script>
{% endblock %}
