upstream django_app {
    # 'web' matches the service name in docker-compose.yml
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Replace with your domain or IP in production

    # Enable gzip compression
    gzip on;
    gzip_static on; # Serve pre-compressed .gz files if present, else gzip on the fly
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-woff
        application/font-woff2
        font/woff
        font/woff2;

    # Serve static files directly via Nginx
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        # Set cache expiration to 1 hour
        expires 1h;
        # Add headers to tell the browser to cache it and that it won't change
        add_header Cache-Control "public, max-age=36000";
    }

    # Pass everything else to Granian
    location / {
        gzip_proxied any; # Compress Django HTML/JSON responses proxied from Granian
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_buffering off;
        
        # Proxy cookie headers for session support
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_cookie_domain web:8000 localhost;
    }
}
