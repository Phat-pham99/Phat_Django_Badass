upstream django_app {
    # 'web' matches the service name in docker-compose.yml
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Replace with your domain or IP in production

    # Serve static files directly via Nginx
    location /staticfiles/ {
        alias /app/staticfiles/;

        access_log off;

        # Set cache expiration to 1 year
        expires 1y;

        # Add headers to tell the browser to cache it and that it won't change
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pass everything else to Granian
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}